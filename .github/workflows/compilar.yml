name: Compilacion y Documentacion Automatica
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Instalar Compilador y Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential doxygen

    - name: Compilar y Ejecutar C++
      run: |
        g++ main.cpp -o convertidor
        ./convertidor > salida_ejecucion.txt

    - name: Generar Documentacion
      run: |
        doxygen Doxyfile

    - name: Guardar Resultados
      uses: actions/upload-artifact@v4
      with:
        name: resultados-proyecto
        path: |
          salida_ejecucion.txt
          doc_output/
